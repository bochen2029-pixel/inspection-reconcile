name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: Demo (every scenario against its oracle)
        run: uv run inspection-reconcile demo --all --out out/demo --force
      - name: Collect identities
        shell: bash
        run: cp out/demo/evaluation_ids.json "out/evaluation_ids-${{ matrix.os }}-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ids-${{ matrix.os }}-${{ matrix.python }}
          path: out/evaluation_ids-*.json

  identical-across-platforms:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ids
          merge-multiple: true
      - name: Every platform produced identical identities and report digests
        shell: bash
        run: |
          ls ids
          first=$(ls ids/*.json | head -n 1)
          for f in ids/*.json; do cmp "$first" "$f"; done
